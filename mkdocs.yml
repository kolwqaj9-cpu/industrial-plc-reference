site_name: "Industrial Automation & Instrumentation Reference"
site_url: https://industrial-plc-reference.readthedocs.io/
site_description: "Industrial Automation & Instrumentation Reference: compiled from public-domain US federal government publications."
site_author: "Industrial PLC Systems Archive"
copyright: "Compiled from public-domain US federal government publications."

docs_dir: docs

theme:
  name: material
  features:
    - navigation.top
  palette:
    - scheme: default
      primary: indigo

nav:
  - Reference: index.md

markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false
